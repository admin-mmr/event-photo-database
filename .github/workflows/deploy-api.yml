name: Deploy api to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'cloud-webapp/api/**'
      - 'cloud-webapp/shared/**'
      - 'cloud-webapp/package.json'
      - 'cloud-webapp/package-lock.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation OIDC token

env:
  SERVICE: event-photo-api
  REPO: cloud-webapp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDP }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push container
        working-directory: cloud-webapp
        env:
          REGION: ${{ secrets.GCP_REGION }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA::7}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          REGION: ${{ secrets.GCP_REGION }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          # Repo variable (Settings → Secrets and variables → Actions → Variables).
          # Set after the matcher service is deployed; empty = findme routes 503.
          MATCHER_URL: ${{ vars.MATCHER_URL }}
          # Repo variable for the optional outfit-tagger service. Unlike
          # MATCHER_URL this is appended to --update-env-vars ONLY when non-empty
          # (see OUTFIT_ENV below), so a repo without the variable set keeps
          # whatever the live service already has instead of being blanked.
          OUTFIT_URL: ${{ vars.OUTFIT_URL }}
          # Master Sheet id for "Sync with Drive" (repo variable); empty = sync 503s.
          MASTER_SPREADSHEET_ID: ${{ vars.MASTER_SPREADSHEET_ID }}
          # NOTE: SYNC_TRIGGER_TOKEN is NOT injected here as a literal env var.
          # It lives in Secret Manager and is wired via --set-secrets below, the
          # same way deploy-api.sh does it. Passing it as a string literal while
          # the live service has it secret-backed fails the deploy with
          # "Cannot update environment variable ... to string literal because it
          # has already been set with a different type."
          # Pilot feature flag (repo variable; dev plan M6.1). Comma-separated
          # event IDs Find Me search is gated to. EMPTY (default) = all events
          # allowed. Set it to the pilot event id to launch to one event; clear
          # it for general rollout (M6.4). Durable here so it survives deploys —
          # a transient `gcloud run services update --update-env-vars` would be
          # wiped by the --set-env-vars below on the next deploy.
          FINDME_EVENT_ALLOWLIST: ${{ vars.FINDME_EVENT_ALLOWLIST }}
          # Upload-to-worker dispatch (Cloud Tasks). Queue/location are static;
          # UPLOAD_WORKER_URL is derived from the live service URL in the run
          # step below (it's stable across deploys, so describing the existing
          # service before the deploy is safe).
          UPLOAD_DISPATCH_TO_WORKER: "true"
          UPLOAD_TASKS_QUEUE: upload-process
          UPLOAD_TASKS_LOCATION: us-central1
          # Request timeout. MUST stay >= the Cloud Tasks dispatchDeadline in
          # api/src/services/uploadDispatch.ts (1800s) and match
          # infra/scripts/deploy-api.sh, or the upload worker is killed mid-batch.
          #
          # This was hardcoded to 60 while deploy-api.sh said 1800, and CI is what
          # deploys — so production ran at 60s. On 2026-07-27 that killed
          # /api/internal/process-batch on ~half its requests (exactly 60.000s,
          # HTTP 504) and stranded 1,188 volunteer photos (~5.1 GB) in the staging
          # bucket, never copied to Drive and so never visible in the gallery.
          # The assertion after the deploy exists so this can never drift silently
          # again. Browser traffic is still capped at 60s by Firebase Hosting;
          # this only widens the window for direct run.app callers (Cloud Tasks,
          # Cloud Scheduler), and costs nothing while idle.
          API_TIMEOUT_SECONDS: "1800"
          # Memory. 512Mi OOM-killed the container 9 times in 3 days — including
          # twice during a live volunteer upload window on 2026-07-27 — because
          # the upload worker buffers a whole photo (~4 MB) per in-flight copy and
          # Cloud Run packs up to `concurrency` requests onto one instance. A kill
          # mid-batch is the expensive kind: it strands claims and drops photos.
          # 1Gi is ~2x the observed 515 MiB peak. Memory bills only while serving
          # (the service still scales to zero), so this does not affect idle cost.
          # Raise it here, not with a manual `gcloud run services update`, which
          # the next deploy would silently revert.
          API_MEMORY: "1Gi"
        run: |
          UPLOAD_WORKER_URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')"
          OUTFIT_ENV=""
          if [ -n "${OUTFIT_URL}" ]; then OUTFIT_ENV=",OUTFIT_URL=${OUTFIT_URL}"; fi
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --platform=managed \
            --port=8080 \
            --memory="${API_MEMORY}" \
            --cpu=1 \
            --max-instances=10 \
            --min-instances=0 \
            --concurrency=80 \
            --timeout="${API_TIMEOUT_SECONDS}" \
            --update-env-vars="NODE_ENV=production,GCP_PROJECT_ID=${PROJECT_ID},FIREBASE_PROJECT_ID=${PROJECT_ID},GIT_COMMIT_SHA=${GITHUB_SHA::7},MATCHER_URL=${MATCHER_URL},MASTER_SPREADSHEET_ID=${MASTER_SPREADSHEET_ID},FINDME_EVENT_ALLOWLIST=${FINDME_EVENT_ALLOWLIST},UPLOAD_DISPATCH_TO_WORKER=${UPLOAD_DISPATCH_TO_WORKER},UPLOAD_TASKS_QUEUE=${UPLOAD_TASKS_QUEUE},UPLOAD_TASKS_LOCATION=${UPLOAD_TASKS_LOCATION},UPLOAD_WORKER_URL=${UPLOAD_WORKER_URL}${OUTFIT_ENV}" \
            --set-secrets="SYNC_TRIGGER_TOKEN=SYNC_TRIGGER_TOKEN:latest,CONSENT_POLICY_VERSION=CONSENT_POLICY_VERSION:latest,RECAPTCHA_API_KEY=RECAPTCHA_KEY:latest"
          # Auth: deliberately pass NEITHER --allow-unauthenticated nor
          # --no-allow-unauthenticated, so the deploy leaves the service's IAM
          # policy untouched (matches deploy-api.sh + CLAUDE.md). --allow-unauthenticated
          # tries to (re)add the allUsers binding, which the org DRS policy blocks
          # and which can itself fail the deploy; --no-allow-unauthenticated strips
          # the allUsers binding the Firebase Hosting rewrite depends on.

          # Fail loudly if the request timeout is not what we asked for. A silent
          # 60s here cost 1,188 volunteer photos (see the API_TIMEOUT_SECONDS note
          # above); a deploy that quietly lowers it must never ship again.
          ACTUAL_TIMEOUT="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(spec.template.spec.timeoutSeconds)')"
          if [ "$ACTUAL_TIMEOUT" != "$API_TIMEOUT_SECONDS" ]; then
            echo "ERROR: deployed timeoutSeconds=$ACTUAL_TIMEOUT, expected $API_TIMEOUT_SECONDS." >&2
            echo "       The Cloud Tasks upload worker needs the full window (dispatchDeadline 1800s" >&2
            echo "       in api/src/services/uploadDispatch.ts) or batches are killed mid-copy." >&2
            exit 1
          fi
          ACTUAL_MEMORY="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(spec.template.spec.containers[0].resources.limits.memory)')"
          if [ "$ACTUAL_MEMORY" != "$API_MEMORY" ]; then
            echo "ERROR: deployed memory=$ACTUAL_MEMORY, expected $API_MEMORY." >&2
            echo "       Under-provisioned memory OOM-kills the upload worker mid-batch." >&2
            exit 1
          fi
          echo "==> Verified request timeout: ${ACTUAL_TIMEOUT}s, memory: ${ACTUAL_MEMORY}"

      - name: Smoke test
        env:
          REGION: ${{ secrets.GCP_REGION }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')
          echo "Service URL: $URL"
          curl -fsS "$URL/api/health"
